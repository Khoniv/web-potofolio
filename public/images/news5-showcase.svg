<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg-news" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg-news)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="150" r="160" fill="#e11d48" opacity="0.08" />
  <circle cx="650" cy="350" r="180" fill="#00f0ff" opacity="0.08" />

  <!-- Portal Browser Window Frame -->
  <rect x="40" y="35" width="720" height="430" rx="14" fill="#0b1222" stroke="#e11d48" stroke-opacity="0.35" stroke-width="1.5" />
  
  <!-- Titlebar -->
  <rect x="40" y="35" width="720" height="42" rx="14" fill="#0f172a" />
  <circle cx="68" cy="56" r="6" fill="#e11d48" />
  <circle cx="88" cy="56" r="6" fill="#ffaa00" />
  <circle cx="108" cy="56" r="6" fill="#00ff66" />
  <text x="400" y="61" text-anchor="middle" fill="#e2f1ff" font-family="'Courier New', monospace" font-size="12" font-weight="bold" letter-spacing="2">NEWS-5 // MODERN EDITORIAL PORTAL &amp; CMS [LARAVEL 11 + LIVEWIRE]</text>

  <!-- Editorial Navbar -->
  <rect x="65" y="90" width="670" height="46" rx="8" fill="#070d1a" stroke="#ffffff" stroke-opacity="0.1" />
  
  <!-- Logo Mark -->
  <rect x="80" y="99" width="28" height="28" rx="6" fill="#0f172a" stroke="#e11d48" stroke-width="1.5" />
  <text x="94" y="118" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">N</text>
  <text x="118" y="119" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="16">News<tspan fill="#e11d48">5</tspan></text>
  
  <!-- Nav items -->
  <text x="240" y="118" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="bold">#HEADLINES</text>
  <text x="345" y="118" fill="#a1b8d4" font-family="monospace" font-size="11">TECHNOLOGY</text>
  <text x="445" y="118" fill="#a1b8d4" font-family="monospace" font-size="11">AUTOMOTIVE</text>
  <text x="545" y="118" fill="#a1b8d4" font-family="monospace" font-size="11">AI &amp; ETHICS</text>
  <rect x="645" y="99" width="75" height="28" rx="6" fill="#e11d48" />
  <text x="682" y="117" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">BACKOFFICE</text>

  <!-- Main Lead Story Feature -->
  <rect x="65" y="150" width="410" height="290" rx="10" fill="#070c18" stroke="#ffffff" stroke-opacity="0.08" />
  
  <!-- Story Image simulation -->
  <rect x="80" y="165" width="380" height="150" rx="8" fill="#131e36" />
  <rect x="95" y="180" width="80" height="20" rx="4" fill="#e11d48" />
  <text x="135" y="194" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">AI &amp; ROBOTICS</text>
  <text x="95" y="235" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="15">Kemkomdigi Siapkan Regulasi Etika AI</text>
  <text x="95" y="258" fill="#7f99b8" font-family="'Segoe UI', sans-serif" font-size="11">Panduan etika kecerdasan buatan untuk ekosistem digital Indonesia...</text>
  
  <!-- Author and Comments -->
  <text x="95" y="295" fill="#00f0ff" font-family="monospace" font-size="10">BY KHONIF ZAKARIA (EDITOR) // 1.4K VIEWS</text>
  
  <!-- Livewire Discussion tag -->
  <rect x="80" y="335" width="380" height="90" rx="6" fill="#0d162a" stroke="#00f0ff" stroke-opacity="0.2" />
  <text x="95" y="358" fill="#00ff66" font-family="monospace" font-size="10" font-weight="bold">&gt; LIVEWIRE 3 REALTIME DISCUSSION [NO-RELOAD]</text>
  <text x="95" y="380" fill="#a1b8d4" font-family="sans-serif" font-size="10">"Regulasi etika sangat krusial untuk perlindungan data lokal!"</text>
  <text x="95" y="405" fill="#7f99b8" font-family="monospace" font-size="9">READER_ID #3849 // REPLIED JUST NOW</text>

  <!-- Right: Backoffice CMS Admin & Trending -->
  <rect x="490" y="150" width="245" height="290" rx="10" fill="#070c18" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="508" y="180" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="bold">&gt; CMS ADMIN &amp; RBAC METRICS</text>

  <rect x="508" y="195" width="210" height="36" rx="6" fill="#0f192e" stroke="#00f0ff" stroke-opacity="0.2" />
  <text x="520" y="217" fill="#ffffff" font-family="monospace" font-size="10">PUBLISHED ARTICLES: 48</text>

  <rect x="508" y="240" width="210" height="36" rx="6" fill="#0f192e" stroke="#00f0ff" stroke-opacity="0.2" />
  <text x="520" y="262" fill="#00ff66" font-family="monospace" font-size="10">ROLES: ADMIN &amp; WRITER</text>

  <rect x="508" y="285" width="210" height="36" rx="6" fill="#0f192e" stroke="#00f0ff" stroke-opacity="0.2" />
  <text x="520" y="307" fill="#fb7185" font-family="monospace" font-size="10">FRAMEWORK: LARAVEL 11</text>

  <!-- Tech tags -->
  <g transform="translate(508, 335)">
    <rect width="65" height="22" rx="4" fill="#1e293b" />
    <text x="32" y="15" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="9" font-weight="bold">PHP 8.3</text>

    <rect x="72" width="70" height="22" rx="4" fill="#1e293b" />
    <text x="107" y="15" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="9" font-weight="bold">LIVEWIRE</text>

    <rect x="150" width="60" height="22" rx="4" fill="#1e293b" />
    <text x="180" y="15" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="9" font-weight="bold">MYSQL</text>
  </g>

  <text x="508" y="395" fill="#7f99b8" font-family="monospace" font-size="9">REPO: github.com/Khoniv/news-5</text>
  <text x="508" y="415" fill="#00ff66" font-family="monospace" font-size="9">STATUS: EDITORIAL READY</text>
</svg>
