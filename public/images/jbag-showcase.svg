<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg-jbag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#04060e" />
    </linearGradient>
    <linearGradient id="gold-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ffd000" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg-jbag)" />

  <!-- Ambient Glow -->
  <circle cx="280" cy="220" r="190" fill="#02569b" opacity="0.12" />
  <circle cx="650" cy="300" r="160" fill="#ffaa00" opacity="0.08" />

  <!-- Window Frame -->
  <rect x="40" y="35" width="720" height="430" rx="14" fill="#090e1c" stroke="#0288d1" stroke-opacity="0.35" stroke-width="1.5" />
  
  <!-- Titlebar -->
  <rect x="40" y="35" width="720" height="42" rx="14" fill="#0f172a" />
  <circle cx="68" cy="56" r="6" fill="#ff007f" />
  <circle cx="88" cy="56" r="6" fill="#ffaa00" />
  <circle cx="108" cy="56" r="6" fill="#00ff66" />
  <text x="400" y="61" text-anchor="middle" fill="#e2f1ff" font-family="'Courier New', monospace" font-size="12" font-weight="bold" letter-spacing="2">JBAG // MOBILE GAME ACCOUNT MARKETPLACE [FLUTTER &amp; DART]</text>

  <!-- Left: Mobile Phone Device Frame -->
  <g transform="translate(75, 95)">
    <!-- Phone Bezel -->
    <rect width="210" height="345" rx="28" fill="#060b17" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="2" />
    <!-- Screen -->
    <rect x="10" y="12" width="190" height="320" rx="20" fill="#0a1324" />
    
    <!-- Phone Notch -->
    <rect x="75" y="16" width="60" height="10" rx="5" fill="#050811" />
    
    <!-- Mobile App Top Bar -->
    <text x="25" y="44" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">🎮 JBAG Store</text>
    <circle cx="180" cy="40" r="4" fill="#00ff66" />

    <!-- Search Input -->
    <rect x="20" y="55" width="170" height="24" rx="6" fill="#131e36" />
    <text x="30" y="71" fill="#7f99b8" font-family="monospace" font-size="9">Search accounts...</text>

    <!-- Game Categories Row -->
    <g transform="translate(20, 90)">
      <rect width="48" height="20" rx="4" fill="#0288d1" />
      <text x="24" y="14" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold">GENSHIN</text>

      <rect x="54" width="44" height="20" rx="4" fill="#1e293b" />
      <text x="76" y="14" text-anchor="middle" fill="#7f99b8" font-family="monospace" font-size="8">MLBB</text>

      <rect x="104" width="40" height="20" rx="4" fill="#1e293b" />
      <text x="124" y="14" text-anchor="middle" fill="#7f99b8" font-family="monospace" font-size="8">PUBG</text>
    </g>

    <!-- Account Card 1 -->
    <rect x="20" y="122" width="170" height="85" rx="8" fill="#0f192e" stroke="#00f0ff" stroke-opacity="0.2" />
    <text x="30" y="142" fill="#ffaa00" font-family="monospace" font-size="10" font-weight="bold">AR 60 // 18 5-STAR CHARS</text>
    <text x="30" y="158" fill="#ffffff" font-family="sans-serif" font-size="9">Raiden C2, Nahida, Kazuha</text>
    <text x="30" y="174" fill="#00ff66" font-family="monospace" font-size="11" font-weight="bold">Rp 650.000</text>
    <rect x="130" y="162" width="50" height="18" rx="4" fill="#00f0ff" />
    <text x="155" y="175" text-anchor="middle" fill="#050a14" font-family="monospace" font-size="8" font-weight="bold">BUY</text>

    <!-- Account Card 2 -->
    <rect x="20" y="215" width="170" height="85" rx="8" fill="#0f192e" stroke="#00f0ff" stroke-opacity="0.2" />
    <text x="30" y="235" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">MYTHICAL GLORY // 280 SKINS</text>
    <text x="30" y="251" fill="#ffffff" font-family="sans-serif" font-size="9">Full Collector &amp; Prime</text>
    <text x="30" y="267" fill="#00ff66" font-family="monospace" font-size="11" font-weight="bold">Rp 420.000</text>
    <rect x="130" y="255" width="50" height="18" rx="4" fill="#00f0ff" />
    <text x="155" y="268" text-anchor="middle" fill="#050a14" font-family="monospace" font-size="8" font-weight="bold">BUY</text>

    <!-- Bottom Nav -->
    <rect x="10" y="305" width="190" height="27" rx="0" fill="#070c18" />
    <text x="45" y="322" text-anchor="middle" fill="#00f0ff" font-size="9">Home</text>
    <text x="105" y="322" text-anchor="middle" fill="#7f99b8" font-size="9">Market</text>
    <text x="165" y="322" text-anchor="middle" fill="#7f99b8" font-size="9">Profile</text>
  </g>

  <!-- Right: Architecture, Multi-channel Payment, Features -->
  <g transform="translate(325, 95)">
    <rect width="410" height="345" rx="10" fill="#050811" stroke="#00f0ff" stroke-opacity="0.2" />
    <text x="25" y="32" fill="#00f0ff" font-family="monospace" font-size="12" font-weight="bold">&gt; MOBILE MARKETPLACE SPECIFICATIONS</text>

    <text x="25" y="62" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="16">Jual Beli Akun Game (JBAG)</text>
    <text x="25" y="85" fill="#a1b8d4" font-family="sans-serif" font-size="11">Secure escrow-style mobile app for purchasing verified gaming accounts with instant checkout and multi-e-wallet payment settlement.</text>

    <!-- Indonesian Payment Gateways -->
    <rect x="25" y="115" width="360" height="58" rx="8" fill="#0c1527" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="40" y="138" fill="#ffaa00" font-family="monospace" font-size="10" font-weight="bold">PAYMENT GATEWAYS INTEGRATED:</text>
    
    <g transform="translate(40, 148)">
      <rect width="65" height="18" rx="4" fill="#118eea" />
      <text x="32" y="13" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">DANA</text>

      <rect x="75" width="65" height="18" rx="4" fill="#00aed6" />
      <text x="107" y="13" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">GOPAY</text>

      <rect x="150" width="60" height="18" rx="4" fill="#4c3494" />
      <text x="180" y="13" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">OVO</text>

      <rect x="220" width="85" height="18" rx="4" fill="#00880c" />
      <text x="262" y="13" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">BANK VA</text>
    </g>

    <!-- Architecture bullet points -->
    <g transform="translate(25, 195)">
      <text x="0" y="15" fill="#00ff66" font-family="monospace" font-size="11">&gt;&gt; Flutter 3.47+ &amp; Dart Clean Architecture</text>
      <text x="0" y="38" fill="#00ff66" font-family="monospace" font-size="11">&gt;&gt; Multi-game Catalog (Genshin, MLBB, Free Fire, Valorant)</text>
      <text x="0" y="61" fill="#00ff66" font-family="monospace" font-size="11">&gt;&gt; State Management, Cart Hydration &amp; Filter Pipelines</text>
      <text x="0" y="84" fill="#00ff66" font-family="monospace" font-size="11">&gt;&gt; Cross-Platform Android &amp; iOS Deployment</text>
    </g>

    <text x="25" y="315" fill="#7f99b8" font-family="monospace" font-size="10">REPO: github.com/Asyra20/JBAG-Jual-Beli-Akun-Game</text>
    <text x="25" y="333" fill="#00ff66" font-family="monospace" font-size="10">AUTHOR TEAM: KHONIF ZAKARIA &amp; ASYRAF</text>
  </g>
</svg>
