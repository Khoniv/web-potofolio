<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg-cs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091424" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="cyan-lime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00ff66" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg-cs)" />

  <!-- Ambient Glow -->
  <circle cx="250" cy="180" r="180" fill="#00f0ff" opacity="0.08" />
  <circle cx="680" cy="320" r="160" fill="#00ff66" opacity="0.07" />

  <!-- Window Frame -->
  <rect x="40" y="35" width="720" height="430" rx="14" fill="#090f1d" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1.5" />
  
  <!-- Titlebar -->
  <rect x="40" y="35" width="720" height="42" rx="14" fill="#0f172a" />
  <circle cx="68" cy="56" r="6" fill="#ff007f" />
  <circle cx="88" cy="56" r="6" fill="#ffaa00" />
  <circle cx="108" cy="56" r="6" fill="#00ff66" />
  <text x="400" y="61" text-anchor="middle" fill="#e2f1ff" font-family="'Courier New', monospace" font-size="12" font-weight="bold" letter-spacing="2">CAPIT STORE // NEXT.JS 15 + MONGODB ATLAS FOOTWEAR E-COMMERCE</text>

  <!-- Store Header -->
  <rect x="65" y="90" width="670" height="46" rx="8" fill="#050a14" stroke="#00f0ff" stroke-opacity="0.2" />
  <text x="85" y="119" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="16">🩴 CAPIT STORE <tspan fill="#7f99b8" font-size="11" font-weight="normal">(NDAWEG STUDIO)</tspan></text>
  
  <text x="360" y="118" fill="#a1b8d4" font-family="monospace" font-size="11">COLLECTIONS</text>
  <text x="470" y="118" fill="#a1b8d4" font-family="monospace" font-size="11">SANDAL GUNUNG</text>
  <text x="590" y="118" fill="#00ff66" font-family="monospace" font-size="11">CART [3]</text>
  <rect x="655" y="99" width="65" height="28" rx="6" fill="#00f0ff" />
  <text x="687" y="117" text-anchor="middle" fill="#050a14" font-family="monospace" font-size="10" font-weight="bold">CLERK</text>

  <!-- Left: Featured Product Cards -->
  <g transform="translate(65, 150)">
    <!-- Card 1 -->
    <rect width="210" height="290" rx="10" fill="#060b17" stroke="#00f0ff" stroke-opacity="0.25" />
    <rect x="15" y="15" width="180" height="135" rx="8" fill="#0f1a30" />
    <text x="105" y="80" text-anchor="middle" font-size="44">🩴</text>
    <text x="105" y="125" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">BLUE FLOP CASUAL</text>
    
    <text x="20" y="175" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">Lurad Classic Sandal</text>
    <text x="20" y="195" fill="#00ff66" font-family="monospace" font-weight="bold" font-size="13">Rp 89.000</text>
    <text x="20" y="215" fill="#7f99b8" font-family="monospace" font-size="9">STOCK: 42 PAIRS AVAILABLE</text>
    
    <rect x="20" y="240" width="170" height="34" rx="6" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="1.2" />
    <text x="105" y="261" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">+ ADD TO CART</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(290, 150)">
    <rect width="210" height="290" rx="10" fill="#060b17" stroke="#00f0ff" stroke-opacity="0.25" />
    <rect x="15" y="15" width="180" height="135" rx="8" fill="#0f1a30" />
    <text x="105" y="80" text-anchor="middle" font-size="44">👞</text>
    <text x="105" y="125" text-anchor="middle" fill="#00ff66" font-family="monospace" font-size="10" font-weight="bold">OUTDOOR EXPLORER</text>
    
    <text x="20" y="175" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">Sandal Gunung Ndaweg</text>
    <text x="20" y="195" fill="#00ff66" font-family="monospace" font-weight="bold" font-size="13">Rp 145.000</text>
    <text x="20" y="215" fill="#7f99b8" font-family="monospace" font-size="9">STOCK: 18 PAIRS AVAILABLE</text>
    
    <rect x="20" y="240" width="170" height="34" rx="6" fill="#00ff66" fill-opacity="0.15" stroke="#00ff66" stroke-width="1.2" />
    <text x="105" y="261" text-anchor="middle" fill="#00ff66" font-family="monospace" font-size="10" font-weight="bold">+ ADD TO CART</text>
  </g>

  <!-- Right: Architecture & Checkout Telemetry -->
  <g transform="translate(515, 150)">
    <rect width="220" height="290" rx="10" fill="#060b17" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="15" y="30" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="bold">&gt; TECH ARCHITECTURE</text>

    <rect x="15" y="45" width="190" height="34" rx="6" fill="#0d182e" stroke="#00f0ff" stroke-opacity="0.2" />
    <text x="25" y="66" fill="#e2f1ff" font-family="monospace" font-size="10">AUTH: CLERK RBAC</text>

    <rect x="15" y="88" width="190" height="34" rx="6" fill="#0d182e" stroke="#00f0ff" stroke-opacity="0.2" />
    <text x="25" y="109" fill="#00ff66" font-family="monospace" font-size="10">DB: MONGODB ATLAS</text>

    <rect x="15" y="131" width="190" height="34" rx="6" fill="#0d182e" stroke="#00f0ff" stroke-opacity="0.2" />
    <text x="25" y="152" fill="#00f0ff" font-family="monospace" font-size="10">QUEUE: INNGEST JOBS</text>

    <!-- Badges -->
    <g transform="translate(15, 180)">
      <rect width="60" height="22" rx="4" fill="#1e293b" />
      <text x="30" y="15" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="9" font-weight="bold">NEXT 15</text>

      <rect x="66" width="60" height="22" rx="4" fill="#1e293b" />
      <text x="96" y="15" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="9" font-weight="bold">REACT 19</text>

      <rect x="132" width="58" height="22" rx="4" fill="#1e293b" />
      <text x="161" y="15" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="9" font-weight="bold">TAILWIND</text>
    </g>

    <text x="15" y="240" fill="#7f99b8" font-family="monospace" font-size="9">REPO: github.com/Khoniv/capit-store</text>
    <text x="15" y="260" fill="#00ff66" font-family="monospace" font-size="9">STATUS: FULLSTACK PRODUCTION</text>
  </g>
</svg>
